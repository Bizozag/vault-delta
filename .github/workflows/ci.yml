name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VaultDelta.sln

      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1

  package-macos:
    name: Package macOS applications
    needs: verify
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package Apple Silicon and Intel applications
        run: ./scripts/publish-macos.sh --version 0.1.8 --skip-verify

      - name: Upload macOS release candidates
        uses: actions/upload-artifact@v4
        with:
          name: vault-delta-macos-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/releases/macos/VaultDelta-0.1.8-osx-arm64.zip
            artifacts/releases/macos/VaultDelta-0.1.8-osx-x64.zip
            artifacts/releases/macos/SHA256SUMS.txt
            artifacts/releases/macos/*/Vault Delta.app/Contents/Info.plist
            artifacts/releases/macos/*/Vault Delta.app/Contents/Resources/release.json

  package-windows:
    name: Package Windows application
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package Windows application
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Version 0.1.8 -SkipVerify

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: vault-delta-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/releases/windows/VaultDelta-0.1.8-win-x64.zip
            artifacts/releases/windows/SHA256SUMS.txt
